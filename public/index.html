<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/><meta name="theme-color" content="#ffffff"/><meta name="description" content="简洁的 Jev 个人判断工具"/><link rel="manifest" href="/manifest.webmanifest"/><link rel="icon" href="/icon.svg"/><link rel="stylesheet" href="/styles.css"/><style>.form-error{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.55}.form-error:not(:empty){text-align:left;background:#fff5f5;border:1px solid #f2cccc;border-radius:12px;padding:13px 14px}</style><title>Jev Pocket</title></head><body>
<main class="app"><header><h1>Jev Pocket</h1><button class="icon-button" id="settingsButton" aria-label="设置"><svg viewBox="0 0 24 24"><path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-2.83 2.83-.06-.06a1.7 1.7 0 0 0-1.88-.34 1.7 1.7 0 0 0-1.03 1.56V21h-4v-.08A1.7 1.7 0 0 0 9 19.36a1.7 1.7 0 0 0-1.88.34l-.06.06-2.83-2.83.06-.06A1.7 1.7 0 0 0 4.63 15 1.7 1.7 0 0 0 3.08 14H3v-4h.08A1.7 1.7 0 0 0 4.64 9a1.7 1.7 0 0 0-.34-1.88l-.06-.06 2.83-2.83.06.06A1.7 1.7 0 0 0 9 4.63 1.7 1.7 0 0 0 10 3.08V3h4v.08A1.7 1.7 0 0 0 15 4.64a1.7 1.7 0 0 0 1.88-.34l.06-.06 2.83 2.83-.06.06A1.7 1.7 0 0 0 19.37 9 1.7 1.7 0 0 0 20.92 10H21v4h-.08A1.7 1.7 0 0 0 19.4 15Z"/></svg></button></header>
<button class="setup-banner" id="setupBanner"><span class="setup-dot"></span><span><b>还差一步就能使用</b><small>填入 TypeSafe API Key，只需设置一次</small></span><svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></button>
<section class="form-section"><label class="section-title" for="text">想判断什么内容？</label><div class="textarea-wrap"><textarea id="text" maxlength="5000" placeholder="粘贴一段文字，或直接输入……"></textarea><span id="textCount">0/5000</span></div></section>
<section><h2>判断方式</h2><div class="mode-tabs" role="radiogroup"><button class="mode active" data-mode="noul">是 / 否</button><button class="mode" data-mode="choice">多选一</button><button class="mode" data-mode="score">程度评分</button></div></section>
<section><label class="field-label" for="question">你的问题</label><input id="question" maxlength="200" placeholder="例如：这段话是否显得很生气？"/></section>
<section id="extraFields" class="extra-fields" hidden></section>
<button class="primary" id="analyze">开始判断</button><p class="form-error" id="formError" role="alert"></p>
<section class="result" id="result" hidden><h2>判断结果</h2><div class="result-panel" id="resultPanel"></div><button class="secondary" id="reset"><svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.34 5.66M20 4v7h-7"/></svg>重新判断</button></section>
</main>
<dialog id="settings"><form method="dialog"><div class="dialog-head"><div><h2>连接 TypeSafe</h2><p>Key 只保存在这台设备的浏览器里。</p></div><button class="dialog-close" value="cancel" aria-label="关闭">×</button></div><label class="field-label" for="apiKey">API Key</label><div class="key-row"><input id="apiKey" type="text" inputmode="text" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="粘贴你的 API Key"/><button type="button" id="toggleKey">隐藏</button></div><p class="privacy">请求会通过本站的安全中转发送；页面不会显示或记录 JSON。</p><button class="primary" id="saveKey" value="default">保存并继续</button><button class="text-button" type="button" id="clearKey">清除已保存的 Key</button></form></dialog>
<script type="module" src="/app.js"></script></body></html>
